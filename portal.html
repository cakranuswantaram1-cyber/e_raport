<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#065f46">
<meta name="robots" content="noindex,nofollow">
<title>Portal Orang Tua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#064e3b;--g2:#047857;--g3:#10b981;--g4:#d1fae5;--gold:#f59e0b;
  --bg:#f3f6f5;--c:#fff;--t:#0f172a;--m:#64748b;--l:#e5ebe9;--soft:#f0fdf4;
  --ok:#059669;--bad:#dc2626;--warn:#d97706;--info:#2563eb;
  --sh:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a1210;--c:#111c19;--t:#ecfdf5;--m:#8fa7a0;--l:#1f302b;--soft:#0f2a22;--g4:#0f3a2d;--sh:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.hide{display:none!important}
.m{color:var(--m)}small,.sm{font-size:12px;color:var(--m)}
svg{display:block}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lg-hero{background:linear-gradient(160deg,var(--g1),var(--g2) 70%,#0d9466);color:#fff;padding:calc(44px + env(safe-area-inset-top)) 24px 90px;text-align:center;position:relative;overflow:hidden}
.lg-hero:before,.lg-hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.06)}
.lg-hero:before{width:260px;height:260px;right:-80px;top:-90px}
.lg-hero:after{width:180px;height:180px;left:-60px;bottom:-70px}
.logo{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;margin:0 auto 16px;position:relative;z-index:1}
.lg-hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;position:relative;z-index:1}
.lg-hero p{margin:6px auto 0;max-width:320px;font-size:13.5px;color:#d1fae5;position:relative;z-index:1}
.lg-box{width:min(440px,100% - 32px);margin:-58px auto 0;background:var(--c);border:1px solid var(--l);border-radius:22px;box-shadow:var(--sh),0 20px 40px rgba(6,78,59,.12);padding:22px;position:relative}
.lg-box label{font-size:12px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.6px}
.inp{display:flex;align-items:center;gap:10px;border:1.5px solid var(--l);background:var(--bg);border-radius:14px;padding:0 14px;margin:8px 0 6px;transition:.15s}
.inp:focus-within{border-color:var(--g3);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--t);font:inherit;font-size:17px;letter-spacing:1.5px;padding:15px 0;outline:0}
.inp button{border:0;background:var(--g4);color:var(--g2);font-weight:700;font-size:12px;padding:7px 11px;border-radius:9px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:2px 0 8px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 18px rgba(5,150,105,.28);display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.7}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px auto 0;width:min(440px,100% - 32px)}
.feat div{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px 6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--m)}
.feat svg{margin:0 auto 6px;color:var(--g2)}
.lg-foot{margin-top:auto;padding:22px 16px calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--m)}
.lock{display:inline-flex;align-items:center;gap:6px}

/* ---------- APP ---------- */
.hd{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 70px;position:relative;overflow:hidden}
.hd:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);right:-70px;top:-80px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#a7f3d0;font-weight:600}
.hd-top .sk{display:flex;align-items:center;gap:8px;min-width:0}
.hd-top .sk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none}
.hd-ic{display:flex;gap:8px}
.prof{display:flex;align-items:center;gap:14px;margin-top:20px}
.av{width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#451a03;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.prof h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#ecfdf5;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
main.wrap{margin-top:-46px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 svg{color:var(--g2)}
.sec-t{font-size:12px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.k{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:12px 10px;box-shadow:var(--sh);min-width:0}
.k .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.k b{display:block;font-size:clamp(14px,4.2vw,17px);font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.k small{display:block;font-size:11px;margin-top:1px}
.i-g{background:var(--g4);color:var(--g2)}.i-b{background:#dbeafe;color:#1d4ed8}.i-a{background:#fef3c7;color:#b45309}.i-r{background:#fee2e2;color:#b91c1c}
@media(prefers-color-scheme:dark){.i-b{background:#17305a;color:#93c5fd}.i-a{background:#3b2a0b;color:#fcd34d}.i-r{background:#3f1515;color:#fca5a5}}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13px;margin-bottom:12px}
.alert.ok{background:var(--soft);border:1px solid var(--g4);color:var(--g2)}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
@media(prefers-color-scheme:dark){.alert.ok{color:#6ee7b7}.alert.warn{background:#2a1f08;border-color:#5b4310;color:#fcd34d}}
.alert svg{flex:none;margin-top:1px}

.saldo-card{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#0d9466);color:#fff;border:0;position:relative;overflow:hidden}
.saldo-card:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);right:-40px;top:-50px}
.saldo-card small{color:#a7f3d0}
.saldo{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:2px 0 12px}
.sd-row{display:flex;gap:10px}
.sd-row div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 11px;font-size:12px;color:#d1fae5}
.sd-row b{display:block;color:#fff;font-size:14px;margin-top:1px}

.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--m);padding:8px;border-radius:9px;font-weight:700;font-size:12.5px}
.seg button.on{background:var(--c);color:var(--g2);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grp{font-size:11.5px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 4px}
.r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--l)}
.r:last-child{border:0}
.r .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.r .tx{flex:1;min-width:0}.r .tx b{display:block;font-size:13.5px}
.in{color:var(--ok);font-weight:800}.out{color:var(--bad);font-weight:800}
.r .amt{font-size:14px;white-space:nowrap}

.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bar i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(var(--g3),var(--g2));min-height:3px}
.bar span{font-size:10.5px;color:var(--m);font-weight:600}

.mp{padding:13px 0;border-bottom:1px solid var(--l)}.mp:last-child{border:0;padding-bottom:0}.mp:first-child{padding-top:0}
.mp-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mp-h b{font-size:14px}
.score{display:flex;align-items:center;gap:7px}
.score strong{font-size:20px;font-weight:800;letter-spacing:-.5px}
.pred{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px}
.pA{background:#dcfce7;color:#166534}.pB{background:#dbeafe;color:#1e40af}.pC{background:#fef3c7;color:#92400e}.pD{background:#fee2e2;color:#991b1b}
@media(prefers-color-scheme:dark){.pA{background:#12361f;color:#86efac}.pB{background:#17305a;color:#93c5fd}.pC{background:#3b2a0b;color:#fcd34d}.pD{background:#3f1515;color:#fca5a5}}
.pg{position:relative;height:8px;background:var(--bg);border-radius:99px;margin:10px 0 8px}
.pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g2),var(--g3))}
.pg i.low{background:linear-gradient(90deg,#b91c1c,#f87171)}
.pg u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);border-radius:2px}
.cmp{display:flex;gap:6px;font-size:11.5px;color:var(--m);flex-wrap:wrap;align-items:center}
.cmp span{background:var(--bg);padding:2px 8px;border-radius:7px;font-weight:600}
.cmp .st{margin-left:auto;font-weight:700}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}

.dn{display:flex;align-items:center;gap:18px}
.dn svg{flex:none}
.lg{flex:1;display:grid;gap:7px;font-size:13px}
.lg div{display:flex;align-items:center;gap:8px}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{margin-left:auto}
.bd{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px}
.b-H{background:#dcfce7;color:#166534}.b-S{background:#fef3c7;color:#92400e}.b-I{background:#dbeafe;color:#1e40af}.b-A{background:#fee2e2;color:#991b1b}
@media(prefers-color-scheme:dark){.b-H{background:#12361f;color:#86efac}.b-S{background:#3b2a0b;color:#fcd34d}.b-I{background:#17305a;color:#93c5fd}.b-A{background:#3f1515;color:#fca5a5}}

.info-r{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--l);font-size:13.5px}
.info-r:last-child{border:0}.info-r span{color:var(--m)}.info-r b{text-align:right}
.btn2{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--l);background:var(--c);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn2.red{color:var(--bad)}
.empty{text-align:center;padding:26px 10px;color:var(--m);font-size:13px}
.empty svg{margin:0 auto 8px;opacity:.5}

nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bn .bni{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:10px;font-weight:700;color:var(--m)}
.nb.on{color:var(--g2)}
.nb.on .pill{background:var(--g4)}
.pill{position:relative;width:42px;height:28px;border-radius:99px;display:grid;place-items:center;transition:.15s}
@media(prefers-color-scheme:dark){.nb.on{color:#6ee7b7}}

.tg{background:var(--c);border:1px solid var(--l);border-left:4px solid var(--g3);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.tg.late{border-left-color:var(--bad)}.tg.soon{border-left-color:var(--gold)}.tg.done{border-left-color:var(--l);opacity:.96}
.tg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mpc{font-size:11px;font-weight:800;color:var(--g2);background:var(--g4);padding:3px 9px;border-radius:7px}
.due{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.d-late{background:#fee2e2;color:#991b1b}.d-soon{background:#fef3c7;color:#92400e}.d-ok{background:var(--bg);color:var(--m)}
.tg b.t{font-size:14.5px;display:block;line-height:1.35}
.hal{display:flex;gap:7px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;font-weight:600}
.hal svg{color:var(--g2);flex:none;margin-top:1px}
.tg-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.nv{font-size:18px;font-weight:800;color:var(--ok);display:flex;align-items:center;gap:6px}
.nv.lo{color:var(--bad)}
@media(prefers-color-scheme:dark){.d-late{background:#3f1515;color:#fca5a5}.d-soon{background:#3b2a0b;color:#fcd34d}}
.bdg{position:absolute;top:-5px;right:-1px;min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px;border:2px solid var(--c)}
.pane{animation:fd .25s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sk-l{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--l),var(--bg),var(--l));background-size:200% 100%;animation:sm 1.2s infinite}
@keyframes sm{to{background-position:-200% 0}}
.ft{text-align:center;font-size:11.5px;color:var(--m);padding:8px 0 0}

@media print{
  body{background:#fff;color:#000}nav.bn,.hd-ic,.seg,.btn2{display:none!important}
  .hd{background:#064e3b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding-bottom:20px}
  main.wrap{margin-top:10px}.pane.hide{display:block!important}.card,.k{box-shadow:none;break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- ======= LOGIN ======= -->
<div id="login">
  <div class="lg-hero">
    <div class="logo"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.3 9 2.3 12 0v-5"/><path d="M22 10v6"/></svg></div>
    <h1>Portal Orang Tua</h1>
    <p>Pantau tugas, tabungan, nilai, dan kehadiran putra/putri Anda kapan saja.</p>
  </div>
  <form class="lg-box" onsubmit="event.preventDefault();masuk()">
    <label for="kode">Kode Akses</label>
    <div class="inp">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--m)"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M15 8l2 2"/></svg>
      <input id="kode" placeholder="Contoh: abc123xyz789" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text">
      <button type="button" onclick="tempel()">Tempel</button>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="bm" type="submit">Masuk</button>
    <p class="sm" style="text-align:center;margin:14px 0 0">Kode akses dibagikan oleh wali kelas. Jika belum menerima atau lupa, silakan hubungi wali kelas.</p>
  </form>
  <div class="feat">
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20M6 15h3"/></svg>Tabungan</div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/><path d="M9 8h6M9 12h6"/></svg>Nilai</div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18m-11 5 2 2 4-4"/></svg>Kehadiran</div>
  </div>
  <div class="lg-foot"><span class="lock"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Data bersifat pribadi &amp; hanya dapat dilihat dengan kode akses Anda</span></div>
</div>

<!-- ======= APP ======= -->
<div id="app" class="hide">
  <header class="hd"><div class="wrap">
    <div class="hd-top">
      <div class="sk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.3 9 2.3 12 0v-5"/></svg><span id="sk"></span></div>
      <div class="hd-ic">
        <button class="ib" onclick="muat(true)" aria-label="Muat ulang" id="rf"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      </div>
    </div>
    <div class="prof">
      <div class="av" id="av"></div>
      <div style="min-width:0"><h1 id="nm"></h1><div class="chips" id="chips"></div></div>
    </div>
  </div></header>

  <main class="wrap">
    <section id="p-ring" class="pane"></section>
    <section id="p-tug" class="pane hide"></section>
    <section id="p-tab" class="pane hide"></section>
    <section id="p-nil" class="pane hide"></section>
    <section id="p-abs" class="pane hide"></section>
    <section id="p-inf" class="pane hide"></section>
    <p class="ft" id="upd"></p>
  </main>

  <nav class="bn"><div class="bni">
    <button class="nb on" data-t="ring"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></span>Ringkasan</button>

<script type="module">

const db=getFirestore(initializeApp({apiKey:"AIzaSyCsJq0wS7WGtVilMLXetmVvFnZZLBf2BgU",authDomain:"portal-ortu-mis.firebaseapp.com",projectId:"portal-ortu-mis",storageBucket:"portal-ortu-mis.firebasestorage.app",messagingSenderId:"460119893896",appId:"1:460119893896:web:fb8d6d69397d0b5eaffc3d"}));

const $=id=>document.getElementById(id);

const ic=(p,s=18)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I={
  down:'<path d="M12 5v14m0 0-6-6m6 6 6-6"/>',up:'<path d="M12 19V5m0 0-6 6m6-6 6 6"/>',

  ok:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4m0 3h.01"/>',

  print:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',

let D=null,KODE=null,flt='all',flt2='all';

async function masuk(k,silent){
  k=(k||$('kode').value).trim().toLowerCase();$('err').textContent='';
  const bm=$('bm');
  if(k.length<8){gagal('Kode tidak valid. Periksa kembali kode akses Anda.');return}

  try{
    const s=await getDoc(doc(db,'portal',k));
    if(!s.exists()){gagal('Kode tidak ditemukan. Periksa kembali atau hubungi wali kelas.');if(silent){try{localStorage.removeItem('portal_kode')}catch(_){}}return}
    KODE=k;try{localStorage.setItem('portal_kode',k)}catch(_){}
    D=s.data();tampil(D);
  }catch(x){gagal('Gagal terhubung. Periksa koneksi internet Anda.')}

}

/* ---------- perhitungan ---------- */
const predikat=n=>n>=90?['A','Sangat Baik','pA']:n>=80?['B','Baik','pB']:n>=70?['C','Cukup','pC']:['D','Perlu Bimbingan','pD'];
function hitung(d){
  const nil=J(d.nilai).map(n=>({m:String(n[0]||''),f:num(n[1]),s:num(n[2]),a:num(n[3]),n:num(n[4]),k:num(n[5])}));
  const isi=nil.filter(x=>x.n>0);
  const rata=isi.length?isi.reduce((a,x)=>a+x.n,0)/isi.length:0;
  const bawah=isi.filter(x=>x.k&&x.n<x.k);
  const best=isi.slice().sort((a,b)=>b.n-a.n)[0];
  const ab=d.absensi||{};const H=num(ab.Hadir),S=num(ab.Sakit),Iz=num(ab.Izin),A=num(ab.Alfa);
  const tot=H+S+Iz+A;const pers=tot?Math.round(H/tot*100):0;
  const tr=J(d.tabungan).map(t=>({d:t[0],j:t[1],n:num(t[2]),k:t[3]||''}));
  const set=tr.filter(t=>t.j==='setor').reduce((a,t)=>a+t.n,0),tar=tr.filter(t=>t.j!=='setor').reduce((a,t)=>a+t.n,0);
  const hr=new Date();hr.setHours(0,0,0,0);
  const tg=J(d.tugas).map(t=>{const w=dt(t[3]);const sel=w?Math.round((w-hr)/864e5):null;return{m:String(t[0]||''),n:String(t[1]||''),k:String(t[2]||''),t:t[3]||'',s:t[4]==='Sudah',v:num(t[5]),sel}});
  const tgB=tg.filter(x=>!x.s).sort((a,b)=>(a.sel??9e9)-(b.sel??9e9)),tgS=tg.filter(x=>x.s);
  const tgR=tgS.length?tgS.reduce((a,x)=>a+x.v,0)/tgS.length:0;
  return{nil,isi,rata,bawah,best,H,S,Iz,A,tot,pers,tr,set,tar,tg,tgB,tgS,tgR};
}

/* ---------- render ---------- */
function tampil(d,reload){
  const c=hitung(d);
  $('login').classList.add('hide');$('app').classList.remove('hide');
  document.title='Portal Orang Tua – '+(d.nama||'');
  $('sk').textContent=d.sekolah||'Portal Orang Tua';
  const ini=String(d.nama||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  $('av').textContent=ini;$('nm').textContent=d.nama||'';
  const ch=[d.kelas&&'Kelas '+d.kelas,d.nis&&'NIS '+d.nis,d.semester&&'Semester '+d.semester,d.tahunajaran].filter(Boolean);
  $('chips').innerHTML=ch.map(x=>'<span class="chip">'+e(x)+'</span>').join('');
  $('p-ring').innerHTML=rRing(d,c);$('p-tug').innerHTML=rTug(d,c);{const b=$('bdg');b.textContent=c.tgB.length;b.classList.toggle('hide',!c.tgB.length)}$('p-tab').innerHTML=rTab(d,c);$('p-nil').innerHTML=rNil(d,c);$('p-abs').innerHTML=rAbs(d,c);$('p-inf').innerHTML=rInf(d,c);
  $('upd').textContent=d.updatedAt?'Data diperbarui: '+new Date(d.updatedAt).toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  bindFilter();
}
function dueTxt(x){if(x.sel==null)return['','d-ok'];if(x.sel<0)return['Terlambat '+(-x.sel)+' hari','d-late'];if(x.sel===0)return['Hari ini','d-soon'];if(x.sel===1)return['Besok','d-soon'];if(x.sel<=3)return[x.sel+' hari lagi','d-soon'];return[x.sel+' hari lagi','d-ok']}
function rRing(d,c){
  const p=predikat(c.rata);
  let al='';
  if(c.isi.length&&!c.bawah.length)al='<div class="alert ok">'+ic(I.ok,20)+'<div><b>Alhamdulillah, semua mata pelajaran tuntas.</b><br>Nilai seluruh mapel sudah mencapai KKM. Terus dukung semangat belajarnya.</div></div>';
  else if(c.bawah.length)al='<div class="alert warn">'+ic(I.warn,20)+'<div><b>Perlu perhatian pada '+c.bawah.length+' mata pelajaran</b><br>'+c.bawah.map(x=>e(x.m)).join(', ')+' masih di bawah KKM. Mohon dampingi belajar di rumah.</div></div>';
  if(c.A>=3)al+='<div class="alert warn">'+ic(I.warn,20)+'<div><b>Ketidakhadiran tanpa keterangan: '+c.A+' hari.</b><br>Mohon konfirmasi ke wali kelas bila ada kendala.</div></div>';
  if(c.tgB.length){const late=c.tgB.filter(x=>x.sel!=null&&x.sel<0).length;
    al='<div class="alert warn" style="cursor:pointer" onclick="document.querySelector(\'.nb[data-t=tug]\').click()">'+ic(I.warn,20)+'<div><b>'+c.tgB.length+' tugas belum dikerjakan'+(late?' ('+late+' terlambat)':'')+'</b><br>'+c.tgB.slice(0,3).map(x=>e(x.m)+': '+e(x.n)+(x.k?' ('+e(x.k)+')':'')).join('<br>')+'<br><u>Lihat semua tugas</u></div></div>'+al}
  else if(c.tgS.length)al='<div class="alert ok">'+ic(I.ok,20)+'<div><b>Semua tugas sudah dikerjakan.</b><br>Barakallahu fiikum, pertahankan.</div></div>'+al;
  const last=c.tr[0];
  return '<div class="kpi">'+
   '<div class="k"><div class="ic i-g">'+ic(I.wallet,16)+'</div><b>'+rp(d.saldo).replace('Rp ','Rp\u00a0')+'</b><small>Saldo tabungan</small></div>'+
   '<div class="k"><div class="ic i-a">'+ic(I.star,16)+'</div><b>'+(c.isi.length?c.rata.toFixed(1):'–')+'</b><small>Rata-rata nilai</small></div>'+
   '<div class="k"><div class="ic i-b">'+ic(I.cal,16)+'</div><b>'+(c.tot?c.pers+'%':'–')+'</b><small>Kehadiran</small></div></div>'+al+
   (c.isi.length?'<div class="card"><h2>'+ic(I.star,18)+'Capaian Belajar</h2><div style="display:flex;align-items:center;gap:14px"><div class="score"><strong style="font-size:34px">'+c.rata.toFixed(1)+'</strong></div><div><span class="pred '+p[2]+'">Predikat '+p[0]+' · '+p[1]+'</span>'+(c.best?'<div class="sm" style="margin-top:6px">Nilai tertinggi: <b style="color:var(--t)">'+e(c.best.m)+' ('+c.best.n+')</b></div>':'')+'</div></div></div>':'')+
   (last?'<div class="card"><h2>'+ic(I.wallet,18)+'Transaksi Terakhir</h2>'+trRow(last)+'</div>':'')+
   '<div class="card"><h2>'+ic(I.cal,18)+'Kehadiran Singkat</h2>'+absMini(c)+'</div>';
}
function trRow(t){const s=t.j==='setor';
  return '<div class="r"><div class="ico '+(s?'i-g':'i-r')+'">'+ic(s?I.down:I.up,18)+'</div><div class="tx"><b>'+e(t.k||(s?'Setoran':'Penarikan'))+'</b><small>'+hari(t.d)+', '+tgl(t.d)+'</small></div><div class="amt '+(s?'in':'out')+'">'+(s?'+':'−')+rp(t.n)+'</div></div>'}
function absMini(c){
  if(!c.tot)return '<div class="empty">Belum ada data kehadiran.</div>';
  return '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="bd b-H">Hadir '+c.H+'</span><span class="bd b-S">Sakit '+c.S+'</span><span class="bd b-I">Izin '+c.Iz+'</span><span class="bd b-A">Alfa '+c.A+'</span></div>'}

function rTug(d,c){
  if(!c.tg.length)return '<div class="card"><div class="empty">'+ic(I.inbox,34)+'<br>Belum ada tugas dari guru.</div></div>';
  return '<div class="kpi"><div class="k"><div class="ic i-r">'+ic(I.warn,16)+'</div><b>'+c.tgB.length+'</b><small>Belum dikerjakan</small></div><div class="k"><div class="ic i-g">'+ic(I.ok,16)+'</div><b>'+c.tgS.length+'</b><small>Sudah dikerjakan</small></div><div class="k"><div class="ic i-a">'+ic(I.star,16)+'</div><b>'+(c.tgS.length?c.tgR.toFixed(0):'–')+'</b><small>Rata-rata nilai</small></div></div>'+
   '<div class="seg" id="segT"><button data-f="all" class="on">Semua</button><button data-f="belum">Belum</button><button data-f="sudah">Sudah</button></div><div id="tgl"></div>';
}
function tgCard(x,KKM){
  const du=dueTxt(x),cl=x.s?'done':(x.sel!=null&&x.sel<0?'late':(x.sel!=null&&x.sel<=3?'soon':''));
  const w=dt(x.t);
  return '<div class="tg '+cl+'"><div class="tg-h"><span class="mpc">'+e(x.m||'Tugas')+'</span>'+(x.s?'<span class="bd b-H">Selesai</span>':'<span class="due '+du[1]+'">'+du[0]+'</span>')+'</div>'+
   '<b class="t">'+e(x.n)+'</b>'+(x.k?'<div class="hal">'+ic('<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/>',16)+'<span>'+e(x.k)+'</span></div>':'')+
   '<div class="tg-f"><small>Tenggat: '+(w?w.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'-')+'</small>'+
   (x.s?'<div class="nv'+(x.v<70?' lo':'')+'">'+ic(I.star,16)+x.v+'</div>':'<span class="bd b-A">Belum dikerjakan</span>')+'</div></div>';
}
function listTg(){
  const c=hitung(D);let a=flt2==='belum'?c.tgB:flt2==='sudah'?c.tgS:c.tgB.concat(c.tgS);
  $('tgl').innerHTML=a.length?a.map(tgCard).join(''):'<div class="card"><div class="empty">'+ic(I.ok,34)+'<br>'+(flt2==='belum'?'Tidak ada tugas yang tertunda.':'Belum ada data.')+'</div></div>';
}
function rTab(d,c){
  // grafik per bulan (dari riwayat yang tersedia)
  const per={};c.tr.forEach(t=>{const k=(t.d||'').slice(0,7);if(!per[k])per[k]={s:0,t:0};t.j==='setor'?per[k].s+=t.n:per[k].t+=t.n});
  const ks=Object.keys(per).sort().slice(-6);const mx=Math.max(1,...ks.map(k=>per[k].s));
  const chart=ks.length>1?'<div class="card"><h2>'+ic('<path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/>',18)+'Setoran per Bulan</h2><div class="bars">'+ks.map(k=>'<div class="bar"><i style="height:'+Math.max(3,per[k].s/mx*100)+'%" title="'+rp(per[k].s)+'"></i><span>'+blnS(k+'-01')+'</span></div>').join('')+'</div></div>':'';
  return '<div class="card saldo-card"><small>Saldo tabungan saat ini</small><div class="saldo">'+rp(d.saldo)+'</div><div class="sd-row"><div>Total setoran<b>'+rp(c.set)+'</b></div><div>Total penarikan<b>'+rp(c.tar)+'</b></div></div></div>'+
   (c.tr.length?'<p class="sm" style="margin:-4px 4px 12px">Total dihitung dari '+c.tr.length+' transaksi terakhir.</p>':'')+chart+
   '<div class="card"><h2>'+ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',18)+'Riwayat Transaksi</h2>'+
   '<div class="seg" id="seg"><button data-f="all" class="on">Semua</button><button data-f="setor">Setoran</button><button data-f="tarik">Penarikan</button></div><div id="trl"></div></div>';
}
function listTr(){
  const c=hitung(D);const a=c.tr.filter(t=>flt==='all'||(flt==='setor'?t.j==='setor':t.j!=='setor'));
  if(!a.length){$('trl').innerHTML='<div class="empty">'+ic(I.inbox,34)+'<br>Belum ada transaksi.</div>';return}
  let h='',cur='';a.forEach(t=>{const b=bln(t.d);if(b!==cur){cur=b;h+='<div class="grp">'+e(b)+'</div>'}h+=trRow(t)});$('trl').innerHTML=h;
}
function bindFilter(){
  const sg=$('seg');if(sg){sg.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;flt=b.dataset.f;sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));listTr()}}
  flt='all';if($('trl'))listTr();
  const sT=$('segT');if(sT){sT.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;flt2=b.dataset.f;sT.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));listTg()}}
  flt2='all';if($('tgl'))listTg();
}

function rNil(d,c){
  if(!c.nil.length)return '<div class="card"><div class="empty">'+ic(I.inbox,34)+'<br>Belum ada nilai.</div></div>';
  const p=predikat(c.rata);
  const top=c.isi.length?'<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><small>Rata-rata nilai akhir</small><div class="score"><strong style="font-size:32px">'+c.rata.toFixed(1)+'</strong><span class="pred '+p[2]+'">'+p[0]+'</span></div></div><div style="text-align:right"><small>Mapel tuntas</small><div style="font-size:22px;font-weight:800">'+(c.isi.length-c.bawah.length)+'<span class="m" style="font-size:14px">/'+c.isi.length+'</span></div></div></div>':'';
  return top+'<div class="card"><h2>'+ic('<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/>',18)+'Nilai per Mata Pelajaran</h2>'+
  c.nil.map(x=>{const pr=predikat(x.n),low=x.k&&x.n<x.k&&x.n>0;
    return '<div class="mp"><div class="mp-h"><b>'+e(x.m)+'</b><div class="score"><span class="pred '+pr[2]+'">'+pr[0]+'</span><strong class="'+(low?'out':'')+'">'+x.n+'</strong></div></div>'+
    '<div class="pg"><i class="'+(low?'low':'')+'" style="width:'+Math.min(100,x.n)+'%"></i>'+(x.k?'<u style="left:'+Math.min(100,x.k)+'%" title="KKM '+x.k+'"></u>':'')+'</div>'+
    '<div class="cmp"><span>Formatif '+x.f+'</span><span>STS '+x.s+'</span><span>SAS '+x.a+'</span>'+(x.k?'<span>KKM '+x.k+'</span>':'')+(x.n>0&&x.k?'<span class="st '+(low?'bad':'ok')+'">'+(low?'Perlu bimbingan':'Tuntas')+'</span>':'')+'</div></div>'}).join('')+'</div>'+
  '<p class="sm" style="padding:0 4px">Garis kuning pada grafik menandai KKM. Predikat: A ≥ 90, B ≥ 80, C ≥ 70, D &lt; 70. STS = Sumatif Tengah Semester, SAS = Sumatif Akhir Semester.</p>';
}

function donut(c){
  const seg=[[c.H,'#10b981'],[c.S,'#f59e0b'],[c.Iz,'#3b82f6'],[c.A,'#ef4444']],R=42,C=2*Math.PI*R;let off=0,h='';
  seg.forEach(([v,col])=>{if(!v)return;const l=v/c.tot*C;h+='<circle cx="55" cy="55" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="13" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 55 55)"/>';off+=l});
  return '<svg width="120" height="120" viewBox="0 0 110 110"><circle cx="55" cy="55" r="'+R+'" fill="none" stroke="var(--bg)" stroke-width="13"/>'+h+'<text x="55" y="53" text-anchor="middle" font-size="22" font-weight="800" fill="var(--t)">'+c.pers+'%</text><text x="55" y="69" text-anchor="middle" font-size="9.5" fill="var(--m)">kehadiran</text></svg>';
}
function rAbs(d,c){
  if(!c.tot)return '<div class="card"><div class="empty">'+ic(I.inbox,34)+'<br>Belum ada data kehadiran.</div></div>';
  const rw=J(d.riwayatAbsensi);const cls={Hadir:'H',Sakit:'S',Izin:'I',Alfa:'A'};
  return '<div class="card"><h2>'+ic(I.cal,18)+'Rekap Kehadiran</h2><div class="dn">'+donut(c)+'<div class="lg">'+
   [['Hadir',c.H,'#10b981'],['Sakit',c.S,'#f59e0b'],['Izin',c.Iz,'#3b82f6'],['Alfa',c.A,'#ef4444']].map(x=>'<div><i style="background:'+x[2]+'"></i>'+x[0]+'<b>'+x[1]+' hari</b></div>').join('')+'</div></div></div>'+
   '<div class="card"><h2>'+ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',18)+'Riwayat Terakhir</h2>'+
   (rw.map(r=>'<div class="r"><div class="tx"><b>'+tgl(r[0])+'</b><small>'+hari(r[0])+'</small></div><span class="bd b-'+(cls[r[1]]||'I')+'">'+e(r[1])+'</span></div>').join('')||'<div class="empty">Belum ada riwayat.</div>')+'</div>';
}

function rInf(d,c){
  const row=(a,b)=>b?'<div class="info-r"><span>'+a+'</span><b>'+e(b)+'</b></div>':'';
  return '<div class="card"><h2>'+ic(I.user,18)+'Data Siswa</h2>'+row('Nama',d.nama)+row('NIS',d.nis)+row('Kelas',d.kelas)+row('Fase',d.fase)+row('Semester',d.semester)+row('Tahun ajaran',d.tahunajaran)+'</div>'+
   '<div class="card"><h2>'+ic('<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.3 9 2.3 12 0v-5"/>',18)+'Sekolah</h2>'+row('Madrasah',d.sekolah)+row('Wali kelas',d.wali)+row('Kepala madrasah',d.kepsek)+'</div>'+
   '<div class="card"><h2>'+ic(I.ok,18)+'Catatan</h2><p class="sm" style="margin:0;line-height:1.6">Informasi pada portal ini diperbarui oleh wali kelas secara berkala dan bersifat hanya-lihat. Jika terdapat data yang kurang sesuai, silakan hubungi wali kelas.</p></div>'+
   '<button class="btn2" onclick="window.print()">'+ic(I.print,18)+'Cetak / Simpan PDF</button>'+
   '<button class="btn2 red" onclick="keluar()">'+ic(I.out,18)+'Keluar</button>';
}

function keluar(){try{localStorage.removeItem('portal_kode')}catch(_){}location.href=location.pathname}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nb').forEach(x=>x.classList.toggle('on',x===b));
  ['ring','tug','tab','nil','abs','inf'].forEach(i=>$('p-'+i).classList.toggle('hide',i!==b.dataset.t));
  window.scrollTo({top:0,behavior:'smooth'});
});
window.masuk=()=>masuk();window.keluar=keluar;window.tempel=tempel;window.muat=muat;
let q=null;try{q=new URLSearchParams(location.search).get('k')||localStorage.getItem('portal_kode')}catch(_){}
if(q){history.replaceState(null,'',location.pathname);masuk(q,true)}
</script>
